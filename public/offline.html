<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0B0F19">
    <title>Neximet Portal — Offline</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: max(24px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); background: #0b0f19; color: #f3f4f6; font: 16px/1.6 system-ui, sans-serif; }
      main { width: 100%; max-width: 420px; padding: 28px; border: 1px solid #1f293d; border-radius: 24px; background: #111827; }
      .brand { color: #5cc5fa; font-weight: 800; letter-spacing: .12em; }
      h1 { font-size: 24px; line-height: 1.3; }
      p { color: #cbd5e1; }
      a { display: inline-flex; align-items: center; justify-content: center; min-height: 44px; padding: 10px 20px; background: #5470f4; border-radius: 12px; color: white; font-weight: 600; text-decoration: none; }
      a:focus-visible { outline: 3px solid #5cc5fa; outline-offset: 4px; }
    </style>
  </head>
  <body>
    <main>
      <div class="brand">NEXIMET</div>
      <h1>You’re offline</h1>
      <p>Reconnect to access your dashboard. Attendance, leave requests, and project changes require an internet connection and are not queued offline.</p>
      <a href="/dashboard">Try again</a>
    </main>
  </body>
</html>
